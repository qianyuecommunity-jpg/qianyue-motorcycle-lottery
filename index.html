<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>皇翔芊樾 · 機車位公開抽籤</title>

<link rel="icon" type="image/jpeg" href="assets/logo-qianyue.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --brand: #1F5A57;          /* 皇翔芊樾 teal */
    --brand-dark: #154340;
    --brand-light: #2E7470;
    --gold: #B8A468;
    --gold-dark: #8C7C4A;
    --bg: #F1ECDF;
    --bg-2: #E7E0CE;
    --paper: #FAF6EA;
    --ink: #1B2421;
    --ink-2: #3F4744;
    --ink-3: #837C6E;
    --rule: #1B2421;
    --rule-soft: rgba(27,36,33,.18);
    --accent: var(--brand);
    --accent-2: var(--gold);
    --accent-soft: rgba(31,90,87,.10);
    --good: oklch(0.55 0.10 165);
    --warn: oklch(0.65 0.14 70);
  }

  *{ box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); }
  body{
    font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .serif { font-family: "Noto Serif TC", "PingFang TC", serif; font-weight: 600; letter-spacing: -.01em; }
  .mono  { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ─── Frame ─── */
  .frame{
    max-width: 1100px; margin: 0 auto; padding: 32px 40px 80px;
    min-height: 100vh; position: relative;
  }
  .head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: 16px; border-bottom: 1px solid var(--rule); margin-bottom: 32px;
  }
  .head .brand{ display:flex; align-items:center; gap: 14px; }
  .head .logo{
    width: 52px; height: 52px; flex-shrink: 0;
    background: var(--brand); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .head .logo img{ width: 100%; height: 100%; object-fit: cover; display:block; }
  .head .brand-text{ display:flex; flex-direction:column; gap: 2px; }
  .head .brand-name{
    font-family:"Noto Serif TC",serif; font-weight:700; font-size: 18px;
    letter-spacing:.04em; color: var(--ink); line-height: 1.1;
  }
  .head .brand-sub{
    font-family:"JetBrains Mono",monospace; font-size: 10px; color: var(--gold-dark);
    letter-spacing:.18em; text-transform: uppercase;
  }
  .head .meta{ font-family:"JetBrains Mono", monospace; font-size: 11px; color: var(--ink-2); letter-spacing:.05em; text-transform: uppercase; text-align: right; }
  .head .meta .meta-l1{ display:block; color: var(--brand); font-weight: 600; }

  /* ─── Step indicator ─── */
  .steps{ display:flex; gap: 28px; margin-bottom: 36px; font-size:12px; }
  .steps .step{ color: var(--ink-3); display:flex; gap:10px; align-items:baseline; }
  .steps .step .n{ font-family:"JetBrains Mono",monospace; font-size:11px; }
  .steps .step.active{ color: var(--ink); }
  .steps .step.active .lbl{ font-weight:600; }
  .steps .step.done{ color: var(--ink-2); }
  .steps .step.done .n::before{ content:"✓ "; color: var(--brand); }
  .steps .sep{ color: var(--ink-3); }

  /* ─── Buttons ─── */
  .btn{
    appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 500;
    padding: 12px 22px; cursor: pointer; letter-spacing:.02em;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn:hover{ background: var(--brand); border-color: var(--brand); }
  .btn:active{ transform: translateY(1px); }
  .btn.ghost{ background: transparent; color: var(--ink); }
  .btn.ghost:hover{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.accent{ background: var(--brand); border-color: var(--brand); color: var(--paper); }
  .btn.accent:hover{ background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.gold{ background: var(--gold); border-color: var(--gold); color: var(--brand-dark); }
  .btn.gold:hover{ background: var(--gold-dark); border-color: var(--gold-dark); color: var(--paper); }
  .btn:disabled{ opacity: .35; cursor: not-allowed; }
  .btn:disabled:hover{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn .arr{ font-family:"JetBrains Mono",monospace; font-weight:600; }

  /* ─── Welcome ─── */
  .welcome-hero{
    display:grid; grid-template-columns: 1fr 380px; gap: 60px;
    margin-top: 32px; align-items:start;
  }
  .welcome-hero .eyebrow{
    display:flex; align-items:center; gap: 14px; margin-bottom: 22px;
    font-family:"JetBrains Mono", monospace; font-size: 11px; color: var(--gold-dark);
    letter-spacing:.22em; text-transform: uppercase;
  }
  .welcome-hero .eyebrow::before{
    content:""; display:inline-block; width: 36px; height: 1px; background: var(--gold);
  }
  .welcome-hero h1{
    font-family: "Noto Serif TC", serif;
    font-weight: 700; font-size: 68px; line-height: 1.02; letter-spacing:-.02em;
    margin: 0 0 26px 0; color: var(--ink);
  }
  .welcome-hero h1 .accent{ color: var(--brand); }
  .welcome-hero h1 .gold{ color: var(--gold-dark); }
  .welcome-hero .sub{ font-size: 17px; color: var(--ink-2); max-width: 540px; line-height: 1.7; margin-bottom: 36px; }
  .welcome-hero .actions{ display:flex; gap: 14px; flex-wrap:wrap; align-items:center; }
  .welcome-hero .hint{ font-size: 12px; color: var(--ink-3); margin-top: 18px; font-family:"JetBrains Mono",monospace; letter-spacing:.04em; }

  .info-card{
    background: var(--brand); border: 1px solid var(--brand);
    padding: 30px 28px 26px;
    position: relative; color: var(--paper);
  }
  .info-card::before{
    content: "FLOW / 流程"; position:absolute; top:-9px; left: 18px;
    background: var(--bg); padding: 0 10px;
    font-family:"JetBrains Mono",monospace; font-size: 10px; letter-spacing:.14em; color: var(--gold-dark);
  }
  .info-card .info-title{
    font-family:"Noto Serif TC",serif; font-weight:600; font-size: 16px;
    color: var(--gold); letter-spacing:.05em; margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(184,164,104,.35);
  }
  .info-card ol{ margin:0; padding:0; list-style: none; counter-reset: flow; }
  .info-card ol li{
    counter-increment: flow; padding: 11px 0; border-bottom: 1px dashed rgba(250,246,234,.18);
    display:grid; grid-template-columns: 36px 1fr; gap: 12px;
  }
  .info-card ol li:last-child{ border-bottom: none; }
  .info-card ol li::before{
    content: counter(flow, decimal-leading-zero);
    font-family:"JetBrains Mono",monospace; font-size: 12px; color: var(--gold); font-weight: 600;
  }
  .info-card ol li b{ font-weight:600; display:block; color: var(--paper); }
  .info-card ol li span{ font-size: 13px; color: rgba(250,246,234,.7); }

  /* ─── Cards / panels ─── */
  .panel{
    background: var(--paper); border: 1px solid var(--rule);
    padding: 20px 22px; position: relative;
  }
  .panel-h{
    display:flex; align-items:baseline; justify-content: space-between;
    border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 14px;
  }
  .panel-h h3{ margin:0; font-family:"Noto Serif TC",serif; font-weight:600; font-size:18px; }
  .panel-h .count{ font-family:"JetBrains Mono",monospace; font-size:12px; color: var(--ink-2); }

  .stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat{
    background: var(--paper); border: 1px solid var(--rule); padding: 20px 22px; position: relative;
  }
  .stat .lbl{ font-family:"JetBrains Mono",monospace; font-size: 11px; color: var(--ink-2); letter-spacing:.06em; text-transform: uppercase; margin-bottom: 8px; }
  .stat .val{ font-family:"Noto Serif TC",serif; font-weight: 700; font-size: 44px; line-height: 1; }
  .stat .unit{ font-size: 14px; color: var(--ink-2); margin-left: 4px; font-family:"Noto Sans TC",sans-serif; font-weight: 400; }
  .stat .sub{ font-size: 12px; color: var(--ink-3); margin-top: 8px; }
  .stat.accent{ background: var(--brand); color: var(--paper); border-color: var(--brand); }
  .stat.accent .lbl{ color: var(--gold); }
  .stat.accent .sub{ color: rgba(250,246,234,.65); }
  .stat.accent .val{ color: var(--paper); }
  .stat.accent::after{
    content:""; position:absolute; top:14px; right:14px; width: 24px; height: 24px;
    border: 1px solid var(--gold); border-radius: 50%;
  }
  .stat.accent::before{
    content:"●"; position:absolute; top:14px; right:14px; width: 24px; height: 24px;
    color: var(--gold); display:flex; align-items:center; justify-content:center; font-size: 8px;
  }

  /* list chips */
  .chip-list{
    display:flex; flex-wrap: wrap; gap: 6px;
    max-height: 220px; overflow-y: auto; padding-right: 4px;
  }
  .chip{
    font-family:"JetBrains Mono", monospace; font-size: 12px;
    padding: 5px 10px; border: 1px solid var(--rule-soft);
    background: var(--bg); color: var(--ink); border-radius: 2px;
  }
  .chip.muted{ color: var(--ink-3); border-style: dashed; background: transparent; text-decoration: line-through; }
  .chip.eligible{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .legend{ font-size:11px; color: var(--ink-3); margin-top: 10px; display:flex; gap: 14px; flex-wrap:wrap; }
  .legend span{ display:flex; align-items:center; gap: 6px; }
  .legend .sw{ width: 10px; height: 10px; display:inline-block; }

  /* ─── Drawing screen ─── */
  .draw-wrap{
    display:grid; grid-template-columns: 1.1fr .9fr; gap: 28px;
  }
  .draw-stage{
    background: var(--paper); border: 1px solid var(--rule);
    padding: 36px 36px 32px; position: relative; min-height: 460px;
    display:flex; flex-direction:column; justify-content: space-between;
  }
  .draw-stage::before{
    content: "DRAWING  /  抽籤中"; position:absolute; top:-9px; left: 22px;
    background: var(--bg); padding: 0 10px;
    font-family:"JetBrains Mono",monospace; font-size: 10px; letter-spacing:.1em; color: var(--accent);
  }
  .draw-now{
    text-align: center; padding: 30px 0 20px;
  }
  .draw-now .lbl{ font-family:"JetBrains Mono",monospace; font-size: 11px; color: var(--ink-2); letter-spacing:.1em; margin-bottom: 18px; }
  .draw-now .slot-no{
    font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 96px; line-height: 1;
    margin-bottom: 14px; letter-spacing:-.02em;
  }
  .draw-now .slot-no .pre{ color: var(--ink-3); font-size: 36px; vertical-align: top; margin-right: 6px; font-weight: 500; }
  .draw-now .arrow{ font-family:"JetBrains Mono",monospace; font-size: 22px; color: var(--ink-3); margin: 6px 0 18px; }
  .reel{
    height: 78px; overflow: hidden; position: relative;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    margin: 0 auto; max-width: 380px;
  }
  .reel-track{
    display:flex; flex-direction:column;
    transition: transform .35s cubic-bezier(.22,.61,.36,1);
  }
  .reel-track .item{
    height: 78px; display:flex; align-items:center; justify-content: center;
    font-family:"JetBrains Mono", monospace; font-size: 34px; font-weight: 600;
    color: var(--ink);
  }
  .reel.settled .reel-track .item{ color: var(--accent); }
  .reel-fade-t, .reel-fade-b{
    position:absolute; left:0; right:0; height: 18px; pointer-events:none;
  }
  .reel-fade-t{ top:0; background: linear-gradient(to bottom, var(--paper), transparent); }
  .reel-fade-b{ bottom:0; background: linear-gradient(to top, var(--paper), transparent); }

  .draw-controls{ display:flex; gap: 12px; justify-content: center; align-items: center; padding-top: 10px; border-top: 1px dashed var(--rule-soft); }
  .draw-controls .ticker{ font-family:"JetBrains Mono",monospace; font-size: 12px; color: var(--ink-2); margin-right: auto; }

  .draw-log{
    background: var(--paper); border: 1px solid var(--rule);
    padding: 22px; position: relative;
  }
  .draw-log::before{
    content: "LOG  /  抽出紀錄";
    position:absolute; top:-9px; left: 18px;
    background: var(--bg); padding: 0 10px;
    font-family:"JetBrains Mono",monospace; font-size: 10px; letter-spacing:.1em; color: var(--ink-2);
    white-space: nowrap;
  }
  .draw-log-inner{ max-height: 520px; overflow-y: auto; }
  .log-row{
    display:grid; grid-template-columns: 64px 1fr 22px 1fr;
    gap: 10px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px dashed var(--rule-soft);
    font-family:"JetBrains Mono", monospace; font-size: 13px;
  }
  .log-row:last-child{ border-bottom: none; }
  .log-row .no{ color: var(--ink-3); }
  .log-row .arr{ color: var(--ink-3); text-align: center; }
  .log-row .spot{ color: var(--ink); }
  .log-row .hh{ color: var(--accent); font-weight: 600; }
  .log-row.empty .hh{ color: var(--ink-3); font-style: italic; font-weight: 400; }
  .log-row.fresh{ animation: pop .5s ease; background: var(--accent-soft); margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
  @keyframes pop{
    0%{ background: var(--accent); }
    100%{ background: transparent; }
  }

  /* ─── Results ─── */
  .results-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .res-card{
    background: var(--paper); border: 1px solid var(--rule); padding: 16px 18px;
    display:flex; flex-direction: column; gap: 4px;
  }
  .res-card .lbl{ font-family:"JetBrains Mono", monospace; font-size: 11px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
  .res-card .spot{ font-family:"Noto Serif TC", serif; font-weight: 700; font-size: 30px; line-height: 1.1; }
  .res-card .hh{ font-family:"JetBrains Mono", monospace; font-size: 15px; color: var(--accent); font-weight: 600; margin-top: 6px; }
  .res-card.empty .hh{ color: var(--ink-3); font-weight: 400; font-style: italic; }
  .res-card .seq{ font-family:"JetBrains Mono", monospace; font-size: 10px; color: var(--ink-3); margin-top: 8px; }

  /* ─── Tabs ─── */
  .tabs{ display:flex; gap: 2px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .tabs button{
    appearance:none; background: transparent; border: 1px solid var(--rule); border-bottom: none;
    font-family:"Noto Sans TC", sans-serif; font-size: 13px; padding: 8px 16px;
    cursor: pointer; color: var(--ink-2); margin-bottom: -1px;
  }
  .tabs button.active{ background: var(--paper); color: var(--ink); font-weight: 600; }

  /* ─── PDF report (off-screen container used by exportResults) ─── */
  .pdf-report{
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: #1B2421; background: #fff; padding: 0;
  }
  .pdf-report h1{ font-size: 22px; margin: 0 0 6px; font-weight: 700; }
  .pdf-report h2{ font-size: 15px; margin: 22px 0 10px; border-bottom: 1.5px solid #1B2421; padding-bottom: 4px; font-weight: 700; }
  .pdf-report h3{ font-size: 12px; margin: 16px 0 6px; font-weight: 600; color: #3F4744; }
  .pdf-report .meta{ font-size: 11px; color: #555; margin-bottom: 14px; font-family: "JetBrains Mono", monospace; }
  .pdf-report table{ width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .pdf-report th, .pdf-report td{ border: 0.5px solid #999; padding: 4px 7px; text-align: left; vertical-align: top; }
  .pdf-report thead th{ background: #EEE8DA; font-weight: 600; }
  .pdf-report td.c, .pdf-report th.c{ text-align: center; }
  .pdf-report td.muted{ color: #888; font-style: italic; }
  .pdf-report .footer{ margin-top: 24px; font-size: 9.5px; color: #837C6E; border-top: 1px solid #ddd; padding-top: 8px; }

  /* ─── Toast / error ─── */
  .alert{
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 18px;
    white-space: pre-line;
  }
  .alert.warn{ background: rgba(0,0,0,.04); border-left-color: var(--warn); }

  /* ─── Misc ─── */
  .row-actions{ display:flex; gap: 12px; justify-content: space-between; align-items:center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule-soft); }
  .row-actions .left{ display:flex; gap: 12px; }
  .row-actions .right{ display:flex; gap: 12px; }
  .empty-note{ color: var(--ink-3); font-size: 13px; padding: 24px 0; text-align: center; font-style: italic; }

  /* drag-over state for welcome */
  .dropzone{
    border: 1.5px dashed var(--rule-soft); padding: 24px 28px; background: rgba(255,255,255,.4);
    margin-top: 22px; transition: all .15s ease; font-size: 13px; color: var(--ink-2);
  }
  .dropzone.over{ border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .dropzone .mono{ display:block; margin-top:6px; font-size:11px; color: var(--ink-3); }

  /* responsive */
  @media (max-width: 900px){
    .frame{ padding: 24px 20px 60px; }
    .welcome-hero{ grid-template-columns: 1fr; gap: 32px; }
    .welcome-hero h1{ font-size: 48px; }
    .draw-wrap{ grid-template-columns: 1fr; }
    .stats{ grid-template-columns: repeat(2, 1fr); }
  }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
// excel-utils.jsx — XLSX import/export helpers
// Exposed on window for cross-script use.

const EXPECTED_COLS = {
  spot: ["機車格號", "車格號", "格號", "車位", "spot"],
  registered: ["登記參與戶別", "登記戶別", "登記", "registered"],
  actual: ["實際參與戶別", "實到戶別", "實到", "actual", "present"],
};

function normalizeHeader(s) {
  if (s == null) return "";
  return String(s).trim().toLowerCase().replace(/\s+/g, "");
}

function findColIndex(headers, candidates) {
  const norm = headers.map(normalizeHeader);
  for (const cand of candidates) {
    const c = normalizeHeader(cand);
    const i = norm.findIndex((h) => h === c || h.includes(c));
    if (i >= 0) return i;
  }
  return -1;
}

// 戶別格式檢查:{戶號}-{樓層}F,戶號 218~238 雙數,樓層 1~13
const HOUSEHOLD_RE = /^(\d+)-(\d+)F$/;
function validateHouseholdFormat(s) {
  const m = s.match(HOUSEHOLD_RE);
  if (!m) return "格式錯誤(應為「戶號-樓層F」,例:220-3F)";
  const building = Number(m[1]);
  const floor = Number(m[2]);
  if (building < 218 || building > 238 || building % 2 !== 0) {
    return `戶號 ${building} 不在 218~238 雙數範圍`;
  }
  if (floor < 1 || floor > 13) {
    return `樓層 ${floor} 不在 1~13 範圍`;
  }
  return null;
}

// Parse imported workbook. Returns { spots, registered, actual, warnings }
function parseWorkbook(wb) {
  const warnings = [];
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

  if (!rows.length) {
    throw new Error("檔案是空的,請使用範本填入資料。");
  }

  const headers = rows[0].map((h) => String(h ?? "").trim());
  const iSpot = findColIndex(headers, EXPECTED_COLS.spot);
  const iReg = findColIndex(headers, EXPECTED_COLS.registered);
  const iAct = findColIndex(headers, EXPECTED_COLS.actual);

  if (iSpot < 0 || iReg < 0 || iAct < 0) {
    throw new Error(
      `欄位辨識失敗。需要欄位:「機車格號」「登記參與戶別」「實際參與戶別」。\n目前讀到的標題:${headers.join(" / ")}`
    );
  }

  const spots = [];
  const registered = [];
  const actual = [];

  const validationErrors = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const s = row[iSpot];
    const reg = row[iReg];
    const act = row[iAct];
    if (s !== "" && s != null) spots.push(String(s).trim());
    if (reg !== "" && reg != null) {
      const v = String(reg).trim();
      const err = validateHouseholdFormat(v);
      if (err) validationErrors.push({ row: r + 1, col: "登記參與戶別", value: v, reason: err });
      registered.push(v);
    }
    if (act !== "" && act != null) {
      const v = String(act).trim();
      const err = validateHouseholdFormat(v);
      if (err) validationErrors.push({ row: r + 1, col: "實際參與戶別", value: v, reason: err });
      actual.push(v);
    }
  }

  if (validationErrors.length) {
    const MAX_LIST = 20;
    const lines = validationErrors.slice(0, MAX_LIST).map(
      (e) => `· 第 ${e.row} 列「${e.col}」=「${e.value}」 — ${e.reason}`
    );
    const more = validationErrors.length > MAX_LIST
      ? `\n…還有 ${validationErrors.length - MAX_LIST} 個錯誤未列出`
      : "";
    throw new Error(
      `戶別格式錯誤 ${validationErrors.length} 處,請修正後重新匯入。\n` +
      `(正確格式:「戶號-樓層F」;戶號為 218~238 雙數,樓層為 1~13)\n` +
      lines.join("\n") + more
    );
  }

  // dedupe + warn
  const dedupe = (arr, label) => {
    const seen = new Set();
    const out = [];
    for (const v of arr) {
      if (seen.has(v)) {
        warnings.push(`${label}有重複值「${v}」,已自動去除。`);
        continue;
      }
      seen.add(v);
      out.push(v);
    }
    return out;
  };

  return {
    spots: dedupe(spots, "機車格號"),
    registered: dedupe(registered, "登記戶別"),
    actual: dedupe(actual, "實到戶別"),
    warnings,
  };
}

// Escape user-supplied strings for safe HTML interpolation in the PDF report.
function escHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Export results as PDF — 直接 orchestrate html2canvas + jsPDF,容器在頁面上短暫可見
async function exportResults({ assignments, waitlist, eligible, registered, actual, spots, unassignedSpots, seed }) {
  const timestamp = new Date().toLocaleString("zh-TW");
  const ts = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  const filename = `機車位抽籤_結果_${ts}.pdf`;

  const eligibleSet = new Set(eligible);
  const wonSpot = new Map(assignments.map((a) => [a.household, a.spot]));
  const wonRank = new Map((waitlist || []).map((w) => [w.household, w.rank]));
  const allHouseholds = [...new Set([...registered, ...actual])].sort();

  const refRows = allHouseholds.map((h) => {
    const got = wonSpot.has(h)
      ? escHtml(wonSpot.get(h))
      : wonRank.has(h)
      ? `候補 ${wonRank.get(h)}`
      : "";
    return `<tr><td>${escHtml(h)}</td><td class="c">${registered.includes(h) ? "✓" : ""}</td><td class="c">${actual.includes(h) ? "✓" : ""}</td><td class="c">${eligibleSet.has(h) ? "✓" : ""}</td><td>${got}</td></tr>`;
  }).join("");

  const assignmentRows = assignments.map((a, i) =>
    `<tr><td>${i + 1}</td><td>${escHtml(a.spot)}</td><td>${escHtml(a.household)}</td><td>${escHtml(a.time)}</td></tr>`
  ).join("");

  const unassignedBlock = (unassignedSpots && unassignedSpots.length) ? `
    <h3>未配對車格(合格戶數不足)</h3>
    <table><thead><tr><th>機車格號</th><th>狀態</th></tr></thead><tbody>${unassignedSpots.map((s) => `<tr><td>${escHtml(s)}</td><td class="muted">無人認領</td></tr>`).join("")}</tbody></table>
  ` : "";

  const waitlistBlock = (waitlist && waitlist.length) ? `
    <h3>候補名單(車格不足,依抽籤順位)</h3>
    <table><thead><tr><th>順位</th><th>候補編號</th><th>戶別</th><th>抽籤時間</th></tr></thead><tbody>${waitlist.map((w) => `<tr><td>${w.rank}</td><td>候補 ${w.rank}</td><td>${escHtml(w.household)}</td><td>${escHtml(w.time || "")}</td></tr>`).join("")}</tbody></table>
  ` : "";

  const container = document.createElement("div");
  container.className = "pdf-report";
  container.innerHTML = `
    <h1>機車位抽籤結果</h1>
    <div class="meta">SEED · ${escHtml(seed)} &nbsp; · &nbsp; 抽籤時間:${escHtml(timestamp)}</div>

    <h2>抽籤結果</h2>
    <table>
      <thead><tr><th>抽籤序</th><th>機車格號</th><th>中籤戶別</th><th>抽籤時間</th></tr></thead>
      <tbody>${assignmentRows}</tbody>
    </table>
    ${unassignedBlock}
    ${waitlistBlock}

    <h2>戶別對照</h2>
    <table>
      <thead><tr><th>戶別</th><th class="c">已登記</th><th class="c">實際到場</th><th class="c">合格</th><th>中籤車格 / 候補</th></tr></thead>
      <tbody>${refRows}</tbody>
    </table>

    <h2>抽籤摘要</h2>
    <table>
      <tbody>
        <tr><td>抽籤時間</td><td>${escHtml(timestamp)}</td></tr>
        <tr><td>亂數種子 (seed)</td><td>${escHtml(seed ?? "(系統隨機)")}</td></tr>
        <tr><td>可抽車格數</td><td>${spots.length}</td></tr>
        <tr><td>登記戶數</td><td>${registered.length}</td></tr>
        <tr><td>實到戶數</td><td>${actual.length}</td></tr>
        <tr><td>合格戶數(交集)</td><td>${eligible.length}</td></tr>
        <tr><td>完成配對數</td><td>${assignments.length}</td></tr>
        <tr><td>未配對車格數</td><td>${(unassignedSpots || []).length}</td></tr>
        <tr><td>候補戶數</td><td>${(waitlist || []).length}</td></tr>
      </tbody>
    </table>

    <div class="footer">本檔由瀏覽器端開源程式生成;以同一 SEED 與輸入名單,任何人皆可離線復現此結果。</div>
  `;

  // 短暫可見於畫面左上角(白底浮層),確保 html2canvas 能正確抓到 layout
  container.style.position = "fixed";
  container.style.top = "0";
  container.style.left = "0";
  container.style.width = "780px";
  container.style.background = "#FFFFFF";
  container.style.zIndex = "99999";
  container.style.padding = "20px";
  container.style.boxShadow = "0 4px 24px rgba(0,0,0,.3)";
  container.style.border = "1px solid #ccc";
  document.body.appendChild(container);

  try {
    // 等 layout / 字型就緒
    await new Promise((r) => setTimeout(r, 100));

    const canvas = await window.html2canvas(container, {
      scale: 2,
      backgroundColor: "#FFFFFF",
      useCORS: true,
      logging: false,
    });

    if (!canvas || !canvas.width || !canvas.height) {
      throw new Error(`html2canvas 抓到空白:${canvas && canvas.width}x${canvas && canvas.height}`);
    }

    const JsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (!JsPDFClass) throw new Error("jsPDF 未載入");

    const pdf = new JsPDFClass({ unit: "mm", format: "a4", orientation: "portrait" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 15;
    const imgW = pageW - margin * 2;
    const pxPerMm = canvas.width / imgW;
    const pageContentHpx = (pageH - margin * 2) * pxPerMm;

    // 智慧斷頁:掃描 canvas 像素列,在「整列幾乎全白」處切頁,避免切到表格列中間
    const ctx = canvas.getContext("2d");
    const pixelData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const W = canvas.width;

    const isWhitespaceRow = (y) => {
      let nonWhite = 0;
      const limit = Math.floor(W / 4 * 0.05); // 容忍 5% 非白像素(細邊框)
      for (let x = 0; x < W; x += 4) {
        const i = (y * W + x) * 4;
        if (pixelData[i] < 245 || pixelData[i + 1] < 245 || pixelData[i + 2] < 245) {
          nonWhite++;
          if (nonWhite > limit) return false;
        }
      }
      return true;
    };

    const findBreakAbove = (target, minY) => {
      for (let y = Math.min(target, canvas.height - 1); y >= minY; y--) {
        if (isWhitespaceRow(y)) return y;
      }
      return target; // fallback:硬切
    };

    const breakpoints = [0];
    let cur = 0;
    while (cur + pageContentHpx < canvas.height) {
      const target = Math.min(cur + pageContentHpx, canvas.height);
      const minSearch = cur + Math.floor(pageContentHpx * 0.6);
      const bp = findBreakAbove(target, minSearch);
      if (bp <= cur) break;
      breakpoints.push(bp);
      cur = bp;
    }
    if (breakpoints[breakpoints.length - 1] < canvas.height) {
      breakpoints.push(canvas.height);
    }

    // 每段切出一個子 canvas,放到對應頁面
    for (let i = 0; i < breakpoints.length - 1; i++) {
      const top = breakpoints[i];
      const bot = breakpoints[i + 1];
      const segH = bot - top;

      const segCanvas = document.createElement("canvas");
      segCanvas.width = canvas.width;
      segCanvas.height = segH;
      const segCtx = segCanvas.getContext("2d");
      segCtx.fillStyle = "#FFFFFF";
      segCtx.fillRect(0, 0, canvas.width, segH);
      segCtx.drawImage(canvas, 0, -top);

      const segDataUrl = segCanvas.toDataURL("image/jpeg", 0.95);
      const segHmm = segH / pxPerMm;

      if (i > 0) pdf.addPage();
      pdf.addImage(segDataUrl, "JPEG", margin, margin, imgW, segHmm);
    }

    pdf.save(filename);
  } catch (err) {
    console.error("PDF 匯出失敗:", err);
    throw err;
  } finally {
    if (container.parentNode) document.body.removeChild(container);
  }
}

// Seeded RNG (mulberry32) for reproducible shuffles
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleWithSeed(arr, seed) {
  const rng = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  downloadTemplate,
  exportResults,
  mulberry32,
  shuffleWithSeed,

          </div>
        )}
        {tab === "registered" && (
          <div>
            <div className="chip-list">
              {data.registered.map((h) => (
                <span key={h} className={`chip ${eligibleSet.has(h) ? "eligible" : ""}`}>{h}</span>
              ))}
            </div>
            <div className="legend">
              <span><i className="sw" style={{ background:"var(--ink)" }}></i>已實到(合格)</span>
              <span><i className="sw" style={{ background:"var(--bg)", border:"1px solid var(--rule-soft)" }}></i>僅登記</span>
            </div>
          </div>
        )}
        {tab === "actual" && (
          <div>
            <div className="chip-list">
              {data.actual.map((h) => {
                const reg = data.registered.includes(h);
                return <span key={h} className={`chip ${reg ? "eligible" : "muted"}`}>{h}</span>;
              })}
            </div>
            <div className="legend">
              <span><i className="sw" style={{ background:"var(--ink)" }}></i>已登記(合格)</span>
              <span><i className="sw" style={{ background:"transparent", border:"1px dashed var(--rule-soft)" }}></i>未登記(不合格)</span>
            </div>
          </div>
        )}
        {tab === "eligible" && (
          <div className="chip-list">
            {eligible.length === 0 && <div className="empty-note">尚無合格戶。請檢查登記名單與實到名單是否有交集。</div>}
            {eligible.map((h) => <span key={h} className="chip eligible">{h}</span>)}
          </div>
        )}
      </div>

      <div className="row-actions">
        <div className="left">
          <button className="btn ghost" onClick={onBack}>← 重新匯入</button>
        </div>
        <div className="right">
          <button className="btn accent" disabled={willAssign === 0} onClick={() => onStart(eligible)}>
            開始抽籤 <span className="arr">→</span>
          </button>
        </div>
      </div>
    </div>
  );
}

window.AppHeader = AppHeader;
window.Steps = Steps;
window.WelcomeScreen = WelcomeScreen;
window.PreviewScreen = PreviewScreen;
</script>
<script type="text/babel" data-presets="env,react">
// drawing.jsx — Drawing animation + 結束時直接匯出 PDF
const { useState: useStateD, useEffect: useEffectD, useRef: useRefD, useMemo: useMemoD, useCallback: useCallbackD } = React;

function DrawingScreen({ data, eligible, seed, autoPlay, onBack }) {
  const plan = useMemoD(() => {
    const shuffledHouseholds = window.shuffleWithSeed(eligible, seed);
    const shuffledSpots = data.spots.slice();
    const pairs = [];
    const waitlist = [];
    const n = Math.min(shuffledSpots.length, shuffledHouseholds.length);
    for (let i = 0; i < n; i++) {
      pairs.push({ type: "spot", spot: shuffledSpots[i], household: shuffledHouseholds[i] });
    }
    for (let i = n; i < shuffledHouseholds.length; i++) {
      waitlist.push({ type: "waitlist", rank: i - n + 1, household: shuffledHouseholds[i] });
    }
    const picks = [...pairs, ...waitlist];
    const unassignedSpots = shuffledSpots.slice(n);
    return { picks, pairs, waitlist, unassignedSpots };
  }, [data, eligible, seed]);

  const [index, setIndex] = useStateD(0);
  const [running, setRunning] = useStateD(autoPlay);
  const [reelOffset, setReelOffset] = useStateD(0);
  const [settled, setSettled] = useStateD(false);
  const [reelItems, setReelItems] = useStateD([]);
  const [exporting, setExporting] = useStateD(false);
  const timerRef = useRefD(null);
  const logRef = useRefD(null);

  const ITEM_H = 78;
  const SPIN_DURATION = 1500; // ms — 轉輪動畫
  const PAUSE_AFTER = 750;    // ms — 每籤結果停留

  const buildReelItems = useCallbackD((finalName) => {
    const pool = eligible.length ? eligible : ["—"];
    const tickCount = 16;
    const out = [];
    for (let i = 0; i < tickCount; i++) {
      out.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    out.push(finalName);
    return out;
  }, [eligible]);

  useEffectD(() => {
    if (!running) return;
    if (index >= plan.picks.length) {
      setRunning(false);
      return;
    }
    const finalName = plan.picks[index].household;
    const items = buildReelItems(finalName);
    setReelItems(items);
    setReelOffset(0);
    setSettled(false);

    const targetOffset = -(items.length - 1) * ITEM_H;
    const rafId = requestAnimationFrame(() => {
      requestAnimationFrame(() => setReelOffset(targetOffset));
    });

    timerRef.current = setTimeout(() => {
      setSettled(true);
      setTimeout(() => {
        setIndex((i) => i + 1);
      }, PAUSE_AFTER);
    }, SPIN_DURATION);

    return () => {
      cancelAnimationFrame(rafId);
      clearTimeout(timerRef.current);
    };
  }, [running, index, plan.picks, buildReelItems]);

  // 自動把 log 捲到最新一筆
  useEffectD(() => {
    if (logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [index, settled]);

  const visibleLog = plan.picks.slice(0, index + (settled ? 1 : 0));
  const currentPick = plan.picks[index];
  const remaining = plan.picks.length - index;
  const allDone = index >= plan.picks.length;

  const handleExport = async () => {
    if (exporting) return;
    setExporting(true);
    try {
      const timestamp = new Date().toLocaleString("zh-TW");
      const assignments = plan.pairs.map((p) => ({
        spot: p.spot,
        household: p.household,
        time: timestamp,
      }));
      const waitlist = plan.waitlist.map((w) => ({
        rank: w.rank,
        household: w.household,
        time: timestamp,
      }));
      await window.exportResults({
        assignments,
        waitlist,
        eligible,
        registered: data.registered,
        actual: data.actual,
        spots: data.spots,
        unassignedSpots: plan.unassignedSpots,
        seed,
      });
    } finally {
      setExporting(false);
    }
  };

  const reelStyle = {
    transform: `translateY(${reelOffset}px)`,
    transition: reelOffset === 0
      ? "none"
      : `transform ${SPIN_DURATION}ms cubic-bezier(.18,.66,.2,1)`,
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom: 20 }}>
        <div className="serif" style={{ fontSize: 28 }}>{allDone ? "抽籤完成" : "抽籤進行中"}</div>
        <div className="mono" style={{ fontSize: 12, color:"var(--ink-3)" }}>
          SEED · {seed} · TARGET {plan.pairs.length} 車格{plan.waitlist.length > 0 ? ` + ${plan.waitlist.length} 候補` : ""}
        </div>
      </div>

      <div className="draw-wrap">
        <div className="draw-stage">
          <div className="draw-now">
            <div className="lbl">— 第 {Math.min(index + 1, plan.picks.length)} / 共 {plan.picks.length} 籤 —</div>
            {allDone ? (
              <div>
                <div className="slot-no" style={{ fontSize: 64, color:"var(--accent)" }}>抽籤完成</div>
                <div className="mono" style={{ fontSize: 13, color:"var(--ink-2)" }}>
                  共配對 {plan.pairs.length} 組{plan.waitlist.length > 0 ? ` · 候補 ${plan.waitlist.length} 位` : ""}
                </div>
              </div>
            ) : currentPick ? (
              <>
                <div className="slot-no">
                  {currentPick.type === "spot" ? (
                    <><span className="pre">車格</span>{currentPick.spot}</>
                  ) : (
                    <><span className="pre">候補</span>{currentPick.rank}</>
                  )}
                </div>
                <div className="arrow">▼</div>
                <div className={`reel ${settled ? "settled" : ""}`}>
                  <div className="reel-fade-t"></div>
                  <div className="reel-fade-b"></div>
                  <div className="reel-track" style={reelStyle}>
                    {reelItems.map((it, i) => (
                      <div className="item" key={i}>{it}</div>
                    ))}
                  </div>
                </div>
              </>
            ) : (
              <div className="slot-no" style={{ fontSize: 48 }}>準備抽籤…</div>
            )}
          </div>

          <div className="draw-controls">
            <div className="ticker">
              {allDone ? "已完成全部抽籤" : `剩餘 ${remaining} 籤`}
            </div>
          </div>
        </div>

        <div className="draw-log">
          <div className="draw-log-inner" ref={logRef}>
          {visibleLog.length === 0 ? (
            <div className="empty-note">尚未抽出任何車格…</div>
          ) : (
            visibleLog.map((p, i) => {
              const isFirstWaitlist = p.type === "waitlist" && (i === 0 || visibleLog[i-1].type === "spot");
              return (
                <React.Fragment key={i}>
                  {isFirstWaitlist && (
                    <div style={{ marginTop: 18, fontSize:11, fontFamily:"JetBrains Mono, monospace", color:"var(--ink-3)", letterSpacing:".1em", textTransform:"uppercase", borderTop:"1px dashed var(--rule-soft)", paddingTop: 12 }}>
                      候補順位
                    </div>
                  )}
                  <div className={`log-row ${i === visibleLog.length - 1 ? "fresh" : ""}`}>
                    {p.type === "spot" ? (
                      <>
                        <span className="no">籤 {String(i + 1).padStart(2, "0")}</span>
                        <span className="spot">車格 #{p.spot}</span>
                      </>
                    ) : (
                      <>
                        <span className="no">候補</span>
                        <span className="spot">第 {String(p.rank).padStart(2, "0")} 順位</span>
                      </>
                    )}
                    <span className="arr">→</span>
                    <span className="hh">{p.household}</span>
                  </div>
                </React.Fragment>
              );
            })
          )}
          {allDone && plan.unassignedSpots.length > 0 && (
            <>
              <div style={{ marginTop: 18, fontSize:11, fontFamily:"JetBrains Mono, monospace", color:"var(--ink-3)", letterSpacing:".1em", textTransform:"uppercase", borderTop:"1px dashed var(--rule-soft)", paddingTop: 12 }}>
                未配對車格
              </div>
              {plan.unassignedSpots.map((s, i) => (
                <div key={`u${i}`} className="log-row empty">
                  <span className="no">空</span>
                  <span className="spot">車格 #{s}</span>
                  <span className="arr">→</span>
                  <span className="hh">(無人)</span>
                </div>
              ))}
            </>
          )}
          </div>
        </div>
      </div>

      <div className="row-actions">
        <div className="left">
          <button className="btn ghost" onClick={onBack}>↺ 重新開始</button>
        </div>
        <div className="right">
          {allDone && (
            <button className="btn accent" onClick={handleExport} disabled={exporting}>
              {exporting ? "正在產生 PDF…" : "匯出 PDF"} <span className="arr">↓</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

window.DrawingScreen = DrawingScreen;
</script>
<script type="text/babel" data-presets="env,react">
// app.jsx — root component, state machine
const { useState: useStateA } = React;

function App() {
  const [screen, setScreen] = useStateA("welcome"); // welcome | preview | drawing
  const [data, setData] = useStateA(null);
  const [fileName, setFileName] = useStateA("");
  const [error, setError] = useStateA(null);
  const [warnings, setWarnings] = useStateA([]);
  const [eligible, setEligible] = useStateA([]);
  const [seed, setSeed] = useStateA(0);

  // ── Demo data loader (for testing without uploading a file)
  const loadDemoData = () => {
    const spots = Array.from({ length: 12 }, (_, i) => String(i + 1));
    const households = [
      "220-2F", "220-3F", "220-5F", "220-7F", "220-9F", "220-11F", "220-12F", "220-13F",
      "218-2F", "218-3F", "218-5F", "218-6F", "218-8F", "218-10F", "218-12F",
    ];
    const registered = households.slice();
    const actual = ["220-2F","220-5F","220-7F","220-9F","220-11F","220-12F","218-2F","218-3F","218-5F","218-8F","218-10F","218-12F","218-13F"];
    setData({ spots, registered, actual });
    setFileName("示範資料.xlsx");
    setWarnings(["這是內建示範資料,實際使用請匯入自己的名單。"]);
    setError(null);
    setScreen("preview");
  };

  const handleImport = (newData, name, err) => {
    if (err) {
      setError(err);
      return;
    }
    setError(null);
    setData(newData);
    setFileName(name);
    setWarnings(newData.warnings || []);
    setScreen("preview");
  };

  const handleStartDrawing = (eligibleList) => {
    setEligible(eligibleList);
    // Generate a fresh seed each time
    setSeed(Math.floor(Math.random() * 1_000_000));
    setScreen("drawing");
  };

  const handleRestart = () => {
    setData(null);
    setFileName("");
    setError(null);
    setWarnings([]);
    setEligible([]);
    setScreen("welcome");
  };

  return (
    <div className="frame">
      <AppHeader />
      <Steps current={screen} />

      {screen === "welcome" && (
        <>
          <WelcomeScreen onImport={handleImport} error={error} />
          <div style={{ marginTop: 56, paddingTop: 22, borderTop: "1px dashed var(--rule-soft)", display:"flex", justifyContent:"space-between", alignItems:"baseline", flexWrap:"wrap", gap: 16 }}>
            <div className="mono" style={{ fontSize: 11, color:"var(--ink-3)", letterSpacing:".06em" }}>
              · 全程於瀏覽器執行,不上傳任何資料 · 可部署於 GitHub Pages 供社區公開使用
            </div>
            <button className="btn ghost" style={{ fontSize: 12, padding: "8px 14px" }} onClick={loadDemoData}>
              載入示範資料
            </button>
          </div>
        </>
      )}

      {screen === "preview" && data && (
        <PreviewScreen
          data={data}
          fileName={fileName}
          warnings={warnings}
          onBack={handleRestart}
          onStart={handleStartDrawing}
        />
      )}

      {screen === "drawing" && data && (
        <DrawingScreen
          data={data}
          eligible={eligible}
          seed={seed}
          autoPlay={true}
          onBack={() => {
            if (window.confirm("確定要從頭開始?目前抽籤紀錄將會清除,需要重新匯入名單。")) {
              handleRestart();
            }
          }}
        />
      )}
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
